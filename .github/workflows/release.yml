name: Release

# Write the release's highlights in docs/releases/<tag>.md before tagging;
# they open the release text. Then push a tag like v0.1.0 to publish:
#   - a GitHub Release with archives of both binaries for Linux, macOS and
#     Windows (amd64/arm64), plus checksums.txt
#   - container images ghcr.io/<owner>/grepalert-agent and
#     ghcr.io/<owner>/grepalert-dashboard for linux/amd64 and linux/arm64
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests
        run: |
          (cd ui && npm ci --no-audit --no-fund && npm run build)
          go vet ./...
          go test -count=1 ./...

      - name: Build archives
        run: VERSION="${GITHUB_REF_NAME#v}" SKIP_UI=1 scripts/release.sh

      # The release text: docs/releases/<tag>.md (the highlights), then how to
      # get it. GitHub appends the generated list of changes.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            if [ -f "docs/releases/$TAG.md" ]; then
              cat "docs/releases/$TAG.md"
              echo
            else
              echo "::warning::docs/releases/$TAG.md is missing; the release has only the generated notes" >&2
            fi
            echo "## Downloads"
            echo
            echo "**Containers** (linux/amd64, linux/arm64):"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/$owner/grepalert-agent:$version"
            echo "docker pull ghcr.io/$owner/grepalert-dashboard:$version"
            echo '```'
            echo
            echo "**Binaries** for Linux, macOS and Windows are attached below, each archive with both programs and example configs (\`checksums.txt\` has their SHA-256)."
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: grepalert ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          # v0.2.0-rc.1 and similar are marked as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      matrix:
        target: [agent, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grepalert-${{ matrix.target }}
          # 0.1.0, 0.1, and latest (except for pre-releases like 0.2.0-rc.1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=grepalert-${{ matrix.target }}
            org.opencontainers.image.description=grepalert ${{ matrix.target }}: log-based alerting without the stack

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
