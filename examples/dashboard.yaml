# grepalert dashboard settings. ${VAR} is expanded from the environment.
# Agents and groups are added in the web UI ("Connect agent", "New group") and
# saved to data_file.
listen: ":9400"
auth:
  # Built-in local admin (break-glass). More local users: UI → Users & access.
  username: admin
  password: ${GREPALERT_DASHBOARD_PASSWORD}
  # Single sign-on (OpenID Connect): Okta, Entra ID, Google, Keycloak, ...
  # oidc:
  #   name: Okta
  #   issuer: https://example.okta.com/oauth2/default
  #   client_id: 0oa1b2c3d4
  #   client_secret: ${OIDC_CLIENT_SECRET}
  #   redirect_url: https://grepalert.example.com/auth/callback
  #   groups_claim: groups
  #   allowed_domains: [example.com]
  # Always-admins: emails, usernames or group:<IdP group>
  # admins: ["group:platform-admins"]
  session_ttl: 12h

# Audit log (JSON lines, rotated at 20 MB). Default: audit.log next to data_file.
# audit_file: /var/lib/grepalert-dashboard/audit.log

# Agents, groups and group rules. Contains agent/git tokens: keep it private.
data_file: /var/lib/grepalert-dashboard/data.json

# How often group members are checked; agents that drifted or came back
# online get the group's rules again.
reconcile_interval: 30s

# Fixed enrollment token for automation (Ansible, Terraform, images). Tokens
# can also be created and revoked in the UI under "Agent enrollment".
# enrollment_token: ${GREPALERT_ENROLL_TOKEN}

# tls_cert: /etc/grepalert/dashboard.crt
# tls_key: /etc/grepalert/dashboard.key
