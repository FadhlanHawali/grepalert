# grepalert agent settings. ${VAR} is expanded from the environment.
name: web-01                    # defaults to the hostname
# Either connect OUT to a dashboard (recommended; no inbound port needed):
# dashboard:
#   url: https://grepalert.example.com
#   enrollment_token: ${GREPALERT_ENROLL_TOKEN}   # used once, at first start
#   # ca_file: /etc/grepalert/ca.pem             # private CA for the dashboard
#   # fallback_after: 15s                         # send alerts directly if the dashboard is unreachable this long
# labels:                                         # dashboard groups can auto-add by label
#   role: web
#   env: prod

# ...or let the dashboard connect IN to this API ("off" disables it):
listen: ":9300"
token: ${GREPALERT_AGENT_TOKEN} # the dashboard sends this as a Bearer token
# tls_cert: /etc/grepalert/agent.crt
# tls_key: /etc/grepalert/agent.key

# Rules are hot-reloaded from this file (checked every rescan_interval) and
# overwritten when the dashboard pushes new rules.
rules_file: rules.yaml

# Extra rules for this machine only, on top of rules_file (which a dashboard
# group may manage). They can add rules but never replace the group's.
# Default: rules.local.yaml next to rules_file. "off" disables.
# local_rules_file: /var/lib/grepalert/rules.local.yaml

# Rules with a `kubernetes:` source follow pod logs. In a cluster the pod's
# service account is used; from outside, point at a kubeconfig.
# kubernetes:
#   kubeconfig: /etc/grepalert/kubeconfig
#   context: prod
#   max_streams: 200

# Read positions are saved here so a restart (or crash) resumes where the agent
# stopped. Default: grepalert.state.json next to rules_file. "off" disables.
# state_file: /var/lib/grepalert/state.json
state_interval: 5s       # how often positions are saved (also saved on shutdown)

start_from: end          # end | beginning — for files with no saved position
poll_interval: 500ms     # how often busy files are checked for new data
idle_poll_interval: 2s   # idle files back off to this (saves CPU with many files)
read_workers: 4          # files read in parallel; also caps CPU cores used to catch up
rescan_interval: 10s     # glob re-scan + rules file change check
max_line_bytes: 16384    # longer lines are truncated, never buffered whole

queue_size: 1000         # pending webhook deliveries; extra alerts are dropped and counted
workers: 2
retries: 2
event_buffer: 500        # recent events kept for the dashboard (fixed ring buffer)
memory_limit: 64MiB      # soft Go runtime memory limit
