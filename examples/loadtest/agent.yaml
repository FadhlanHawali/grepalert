# Every load-test VM enrolls itself with the dashboard and joins groups by
# label. The API listens on localhost only: the dashboard cannot reach the VM,
# so all management goes through the agent's outbound connection.
dashboard:
  url: http://dashboard:9400
  enrollment_token: loadtest-enroll
labels:
  role: api
  env: loadtest
listen: "127.0.0.1:9300"
rules_file: /var/lib/grepalert/rules.yaml
state_file: /var/lib/grepalert/state.json
memory_limit: 32MiB
