# Dashboard config for the local Keycloak in this folder.
listen: "127.0.0.1:9420"
data_file: ./sso-data/data.json
auth:
  # break-glass local admin
  username: root
  password: ${GREPALERT_ROOT_PASSWORD}
  oidc:
    name: Keycloak
    issuer: http://localhost:8180/realms/grepalert
    client_id: grepalert-dashboard
    client_secret: vHTgpLg1J6eML4UGzRtiBXQkfVpOufim   # test value from realm-grepalert.json
    redirect_url: http://localhost:9420/auth/callback
    scopes: [openid, email, profile]
  admins: ["group:grepalert-admins"]
