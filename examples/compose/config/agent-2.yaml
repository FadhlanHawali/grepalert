# agent-2 is a "direct" agent: the dashboard connects to it (Connect agent →
# http://agent-2:9300). Its rules are seeded from config/agent-2-rules.yaml.
name: edge-proxy-1
listen: ":9300"
token: ${GREPALERT_AGENT_TOKEN}
rules_file: /var/lib/grepalert/rules.yaml
state_file: /var/lib/grepalert/state.json
start_from: end
memory_limit: 32MiB
