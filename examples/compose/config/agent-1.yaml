# agent-1 connects OUT to the dashboard: it enrolls with the token below on
# first start and needs no inbound port. Groups pick it up by its labels.
name: app-server-1
dashboard:
  url: http://dashboard:9400
  enrollment_token: ${GREPALERT_ENROLL_TOKEN}
labels:
  role: app
  env: demo
listen: "127.0.0.1:9300"   # local only, for the container health check
rules_file: /var/lib/grepalert/rules.yaml
state_file: /var/lib/grepalert/state.json
start_from: end
memory_limit: 32MiB
